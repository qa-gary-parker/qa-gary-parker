name: Latest writing
on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: gautamkrishnar/blog-post-workflow@1.9.7
        with:
          feed_list: "https://garyparker.dev/feed.xml"
          max_post_count: "4"
